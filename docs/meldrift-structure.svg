<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc">
  <title id="title">Meldrift v1.3 Beta architecture</title>
  <desc id="desc">Free and Plus share board UI and browser storage. Plus synchronizes deltas to Neon, while snapshot mode remains for legacy boards.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52606d"/></marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #24313b; }
      .heading { font-size: 23px; font-weight: 700; }
      .label { font-size: 19px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 14px; }
      .box { stroke: #bac7cd; stroke-width: 1.5; }
      .line { fill: none; stroke: #52606d; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="1040" fill="#ffffff"/>
  <text x="40" y="46" class="heading">Meldrift v1.3 Beta</text>
  <text x="40" y="74" class="body">Canvas-based Markdown compiler / shared local-first editor</text>

  <rect x="40" y="100" width="540" height="98" rx="8" class="box" fill="#edf6fc"/>
  <text x="62" y="134" class="label">Free Board /</text>
  <text x="62" y="163" class="body">Single browser board · no account required</text>
  <rect x="620" y="100" width="540" height="98" rx="8" class="box" fill="#eaf8f1"/>
  <text x="642" y="134" class="label">Plus /plus</text>
  <text x="642" y="163" class="body">Board list · Neon session / approval · server sync</text>
  <path d="M310 198V230H600V250" class="line"/>
  <path d="M890 198V230H600" fill="none" stroke="#52606d" stroke-width="2"/>

  <rect x="40" y="250" width="1120" height="170" rx="8" class="box" fill="#f5f7f8"/>
  <text x="62" y="285" class="label">packages/ui</text>
  <text x="62" y="317" class="body">Memos · images · tables · Mermaid / CodeMirror · drawing</text>
  <text x="62" y="345" class="body">Move / resize / layer · group selection · reorder · search · zoom / pan</text>
  <text x="62" y="373" class="body">Undo / Redo: 50 in-memory operations · keyboard shortcuts · shared menu</text>
  <text x="62" y="400" class="small">Object history excludes viewport, auth, server revision and transfer queues.</text>
  <path d="M600 420V460" class="line"/>

  <rect x="40" y="460" width="740" height="156" rx="8" class="box" fill="#edf6fc"/>
  <text x="62" y="496" class="label">packages/board-data</text>
  <text x="62" y="526" class="body">BoardSnapshot · image conversion · Markdown compiler</text>
  <text x="62" y="554" class="body">150ms local debounce → SQLite worker → IndexedDB</text>
  <text x="62" y="582" class="body">SQLite Export / Import · Plus diff / durable outbox</text>
  <rect x="820" y="460" width="340" height="156" rx="8" class="box" fill="#f5f7f8"/>
  <text x="842" y="496" class="label">packages/core</text>
  <text x="842" y="526" class="body">Card / stroke / table schemas</text>
  <text x="842" y="554" class="body">Order / geometry / Mermaid</text>
  <text x="842" y="582" class="body">Framework-free rules</text>
  <path d="M780 538H820" class="line"/>

  <path d="M200 616V656" class="line"/>
  <rect x="40" y="656" width="320" height="76" rx="8" class="box" fill="#edf6fc"/>
  <text x="62" y="687" class="label">Free: local save complete</text>
  <text x="62" y="711" class="small">No remote board storage</text>
  <path d="M580 616V656" class="line"/>
  <rect x="400" y="656" width="760" height="76" rx="8" class="box" fill="#eaf8f1"/>
  <text x="422" y="687" class="label">Plus: 3s after successful local save</text>
  <text x="422" y="711" class="small">ChangeSync → fields / strokes / new assets · 1MiB binary chunks</text>
  <path d="M780 732V774" class="line"/>

  <rect x="400" y="774" width="760" height="112" rx="8" class="box" fill="#eaf8f1"/>
  <text x="422" y="808" class="label">Plus API → Neon</text>
  <text x="422" y="838" class="body">Auth / permissions · revision · idempotent mutation · batch commit</text>
  <text x="422" y="866" class="small">Cards / strokes · assets / chunks · sync state / upload sessions</text>
  <rect x="40" y="774" width="320" height="112" rx="8" class="box" fill="#fff5df"/>
  <text x="62" y="808" class="label">Compatibility path</text>
  <text x="62" y="838" class="body">snapshot mode only:</text>
  <text x="62" y="866" class="small">Whole SQLite → board_snapshots</text>
  <path d="M360 830H400" class="line"/>

  <rect x="40" y="930" width="540" height="76" rx="8" class="box" fill="#f4effa"/>
  <text x="62" y="960" class="label">packages/ai → Gemini</text>
  <text x="62" y="986" class="small">Passcode gate · review proposed changes before applying</text>
  <rect x="620" y="930" width="540" height="76" rx="8" class="box" fill="#fff5df"/>
  <text x="642" y="960" class="label">Plus board previews → Cloudinary</text>
  <text x="642" y="986" class="small">New image cards use binary assets, not Cloudinary uploads</text>
  <path d="M890 886V930" class="line"/>
</svg>
