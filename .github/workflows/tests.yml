name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEON_CONNECTION_STRING: ${{ secrets.NEON_CONNECTION_STRING }}
      E2E_BOARD_ID: ${{ secrets.E2E_BOARD_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build applications
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run Free E2E tests
        run: npm run test:e2e:free

      # Dependabot PR은 일반 repo secret을 받지 못한다(Dependabot secret만 전달된다).
      # 그래서 NEON_CONNECTION_STRING이 빈 값이 되고 Plus E2E가 DB 연결에서 실패한다.
      # secret이 있을 때만 실행하고, 없으면 이유를 남기고 건너뛴다.
      - name: Run Plus E2E tests
        if: ${{ env.NEON_CONNECTION_STRING != '' }}
        run: npm run test:e2e:plus

      - name: Skip Plus E2E tests
        if: ${{ env.NEON_CONNECTION_STRING == '' }}
        run: echo "::notice::NEON_CONNECTION_STRING이 없어 Plus E2E를 건너뜁니다."

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/*/playwright-report/
          retention-days: 30
