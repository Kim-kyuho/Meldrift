# Dependabot 설정 옵션 문서:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    versioning-strategy: increase

    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"

    groups:
      next-react:
        patterns:
          - "next"
          - "@next/*"
          - "eslint-config-next"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - "minor"
          - "patch"

      tiptap:
        patterns:
          - "@tiptap/*"
        update-types:
          - "minor"
          - "patch"

      codemirror:
        patterns:
          - "@codemirror/*"
        update-types:
          - "minor"
          - "patch"

      mermaid:
        patterns:
          - "mermaid"
          - "@mermaid-js/*"
        update-types:
          - "minor"
          - "patch"

      styling:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "lightningcss"
          - "lightningcss-*"
        update-types:
          - "minor"
          - "patch"

      database:
        patterns:
          - "drizzle-orm"
          - "drizzle-kit"
          - "@neondatabase/*"
        update-types:
          - "minor"
          - "patch"

      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@playwright/test"
          - "@testing-library/*"
          - "jsdom"
        update-types:
          - "minor"
          - "patch"

      remaining:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
