services:
  free:
    build:
      context: ./apps/free
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      PLUS_ORIGIN: http://plus:3001
    command: npm run dev -- --hostname 0.0.0.0 --port 3000
    volumes:
      - ./apps/free:/app
      - meldrift_free_node_modules:/app/node_modules
    depends_on:
      - plus

  plus:
    build:
      context: ./apps/plus
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - ./apps/plus/.env.local
    command: npm run dev -- --hostname 0.0.0.0 --port 3001
    volumes:
      - ./apps/plus:/app
      - meldrift_plus_node_modules:/app/node_modules

volumes:
  meldrift_free_node_modules:
  meldrift_plus_node_modules:
